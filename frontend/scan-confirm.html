<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>确认登录 · 校园 AI 助手</title>
  <meta name="description" content="校园 AI 助手：时间表、AI 学业规划、校园地图导航、情绪陪伴、学校手册问答。">
  <link rel="icon" href="favicon.ico?v=20261022a" sizes="any" />
  <link rel="icon" type="image/png" href="favicon.png?v=20261022a" />
  <link rel="apple-touch-icon" href="favicon.png?v=20261022a" />
  <!-- 主题要在首次绘制前落到 <html> 上，否则刷新会先闪一下白底。
       这段**必须是内联**的：换成外链脚本会晚一帧，那一帧就足够看见闪白了。
       没存过偏好、或选了「跟随系统」时，按系统的深色偏好决定初始主题。 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t || t === "auto") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (t === "dark" || t === "eye") document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* 隐私模式读不到，按白天走 */ }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=20261022a" />
</head>
<body>
  <!-- 这一页是给**手机**看的：窄屏、大按钮、尽量少的元素 -->
  <div class="confirm-page">
    <div class="confirm-card">
      <div class="auth-brand"><span class="logo-mark" id="cf-logo"></span> 校园 AI 助手</div>

      <!-- 三种状态互斥显示：待确认 / 成功 / 失败 -->
      <div id="cf-body">
        <div class="confirm-ico" id="cf-ico"></div>
        <h2 class="confirm-title" id="cf-title">确认登录</h2>
        <p class="confirm-text" id="cf-text">正在检查二维码…</p>

        <div class="confirm-user" id="cf-user" style="display:none">
          <span class="confirm-user-ico" id="cf-user-ico"></span>
          <div>
            <div class="confirm-user-name" id="cf-user-name"></div>
            <div class="confirm-user-tip">将以此账号登录另一端</div>
          </div>
        </div>

        <button class="btn block" id="cf-btn" style="display:none" onclick="doConfirm()">确认登录</button>
        <a class="btn block ghost" id="cf-back" href="login.html" style="display:none">去登录</a>
      </div>
    </div>
    <p class="confirm-foot">为了你的账号安全，请勿将本页链接发给他人</p>
  </div>

  <script src="js/config.js?v=20261022a"></script>
  <script src="js/icons.js?v=20261022a"></script>
  <script src="js/common.js?v=20261022a"></script>
  <script src="js/scan-confirm.js?v=20261022a"></script>
</body>
</html>
