<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天气地图导航 · 校园 AI 助手</title>
  <meta name="description" content="校园 AI 助手：时间表、AI 学业规划、校园地图导航、情绪陪伴、学校手册问答。">
  <link rel="icon" href="favicon.ico?v=20261022a" sizes="any" />
  <link rel="icon" type="image/png" href="favicon.png?v=20261022a" />
  <link rel="apple-touch-icon" href="favicon.png?v=20261022a" />
  <!-- 主题要在首次绘制前落到 <html> 上，否则刷新会先闪一下白底。
       这段**必须是内联**的：换成外链脚本会晚一帧，那一帧就足够看见闪白了。
       没存过偏好、或选了「跟随系统」时，按系统的深色偏好决定初始主题。 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t || t === "auto") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (t === "dark" || t === "eye") document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* 隐私模式读不到，按白天走 */ }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=20261022a" />
</head>
<body>
  <main id="main" class="container">
    <div class="page-head">
      <div>
        <h2><span class="h-ico" data-icon="map" data-icon-size="22"></span>天气地图导航</h2>
        <p class="muted">今日天气与降雨提醒，校园地图，校内任意点位之间导航，起终点可自选。</p>
      </div>
    </div>

    <!-- 天气提示（API 空：先占位） -->
    <div class="weather-tip" id="weather-tip">
      <b><span class="h-ico" data-icon="weather" data-icon-size="20"></span>今日天气</b>
      <div id="weather-text" class="muted" style="margin-top:6px;">正在获取天气提示…（接入高德 + GLM 后展示温度与是否带伞）</div>
    </div>

    <div class="map-layout">
      <!-- 左栏：地图。sticky 固定在视口高度内，滚页面时地图不跑掉。 -->
      <div class="card map-pane">
        <div id="map"></div>
        <!-- 类型筛选：点一下只看某一类点位，再点一次恢复全部 -->
        <div class="type-filter" id="type-filter"><!-- JS 生成 --></div>
        <div class="row" style="margin-top:10px; gap:10px;">
          <button class="btn ghost" onclick="clearRoute()">清除路线</button>
        </div>
      </div>

      <!-- 右栏：导航设置 + 路线 + 点位。
           路线一出来这里会变很长，所以给**自己**一个滚动区（.side-pane），
           让它内部滚而不是把整页往下顶 —— 页面高度锁在视口内，
           地图和输入框始终停在原地，看路线不用来回滚。 -->
      <div class="card side-pane">
        <h3>导航设置</h3>
        <p class="muted" style="margin:-4px 0 12px;">
          点左边地图上的标记，就会自动填进你<b>刚点过</b>的那个框（看框的高亮）。
        </p>
        <div class="field">
          <label for="origin">起点（留空 = 用校内默认出发点）</label>
          <input id="origin" list="building-options" autocomplete="off"
                 placeholder="留空就默认从图书馆出发" />
        </div>
        <div class="field">
          <label for="dest">终点（教学楼 / 宿舍 / 食堂 / 图书馆…）</label>
          <input id="dest" list="building-options" autocomplete="off"
                 placeholder="输入或选择校内点位" />
        </div>
        <!-- 点位联想候选：原生 datalist，输入时会自动筛选 -->
        <datalist id="building-options"><!-- JS 生成 --></datalist>

        <p class="muted" style="margin:-4px 0 10px;font-size:12.5px;">
          <b>起点留空</b>就默认从图书馆出发（可在起点里改成任意校内地名）；
          校内道路都走真实路网，比如去图书馆或游泳馆也能导航。
        </p>
        <div class="row" style="gap:10px;">
          <button class="btn" style="flex:1" onclick="startNav()">开始导航</button>
        </div>

        <!-- 分步路线指引（JS 填充） -->
        <div id="route-steps" class="route-steps"></div>

        <hr />
        <h3>校内点位</h3>
        <p class="muted" style="margin:-4px 0 10px;font-size:12.5px;">
          点一下即可填入起终点。教学楼之外，宿舍、食堂、图书馆等也都能导航。
        </p>
        <div class="poi-list" id="poi-list"><!-- JS 生成 --></div>
        <p class="muted" style="margin-top:10px;">提示：从「学业规划助手」点课程可直接带终点进入本页。</p>
      </div>
    </div>
  </main>

  <script src="js/config.js?v=20261022a"></script>
  <script src="js/campus.js?v=20261022a"></script>
  <script src="js/campus-graph.js?v=20261022a"></script>
  <script src="js/icons.js?v=20261022a"></script>
  <script src="js/common.js?v=20261022a"></script>
  <script src="js/nav.js?v=20261022a"></script>
</body>
</html>
